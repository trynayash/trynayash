name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: trynayash
          outputs: |
            .github/assets/github-snake.svg
            .github/assets/github-snake-dark.svg?palette=github-dark

      - name: Commit assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/assets/github-snake.svg
          git add .github/assets/github-snake-dark.svg
          git commit -m "Update snake assets" || exit 0
          git push
